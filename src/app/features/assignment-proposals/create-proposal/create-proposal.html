<mat-card>

<h1>

Nouvelle proposition

</h1>

<form
[formGroup]="form"
(ngSubmit)="submit()">

<mat-form-field appearance="outline">

<mat-label>

Enseignant

</mat-label>

<mat-select formControlName="enseignantMatricule">

@for(t of teachers;track t.matricule){

<mat-option [value]="t.matricule">

{{t.nom}} {{t.prenom}}

</mat-option>

}

</mat-select>

</mat-form-field>

<mat-form-field appearance="outline">

<mat-label>

Matière

</mat-label>

<mat-select formControlName="matiereId">

@for(m of subjects;track m.id_matiere){

<mat-option [value]="m.id_matiere">

{{m.nom}}

</mat-option>

}

</mat-select>

</mat-form-field>

<mat-form-field appearance="outline">

<mat-label>

Année

</mat-label>

<input
matInput
formControlName="anneeId">

</mat-form-field>

<mat-form-field appearance="outline">

<mat-label>

Classes

</mat-label>

<mat-select
multiple
formControlName="classeIds">

@for(c of classes;track c.id_classe){

<mat-option [value]="c.id_classe">

{{c.LIBELLE}}

</mat-option>

}

</mat-select>

</mat-form-field>

<button
mat-flat-button
color="primary">

Proposer

</button>

</form>

</mat-card>
