<h2 mat-dialog-title>
  {{ data?.id ? 'Modifier une proposition' : 'Nouvelle proposition' }}
</h2>

<mat-dialog-content>

  <form [formGroup]="form">

    <app-academic-context
      [config]="academicContextConfig"
      [showResetButton]="false">
    </app-academic-context>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    mat-dialog-close>
    Annuler
  </button>

  <button
    mat-flat-button
    color="primary"
    [disabled]="form.disabled"
    (click)="save()">
    {{ data?.id ? 'Mettre à jour' : 'Enregistrer' }}
  </button>

</mat-dialog-actions>
