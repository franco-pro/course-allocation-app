<div class="crud-container">

  <div class="header">

    <div>

      <h1>{{ title }}</h1>

      <p>{{ subtitle }}</p>

    </div>

    @if(showAdd){

      <button
        mat-flat-button
        color="primary"
        (click)="add.emit()">

        <mat-icon>add</mat-icon>

        Ajouter

      </button>

    }

  </div>

  <mat-form-field
    appearance="outline"
    class="search-field">

    <mat-label>

      Rechercher

    </mat-label>

    <input
      matInput
      [(ngModel)]="search"
      (ngModelChange)="onSearch($event)">

    <mat-icon matSuffix>

      search

    </mat-icon>

  </mat-form-field>

  <table
    mat-table
    [dataSource]="data"
    matSort
    (matSortChange)="sortChange.emit($event)">

    @for(col of columns; track col.key){

      <ng-container [matColumnDef]="col.key">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header>

          {{ col.title }}

        </th>

        <td
          mat-cell
          *matCellDef="let row">

          {{ row[col.key] }}

        </td>

      </ng-container>

    }

    <ng-container matColumnDef="actions">

      <th mat-header-cell *matHeaderCellDef>

        Actions

      </th>

      <td mat-cell *matCellDef="let row">

        @if(showEdit){

          <button
            mat-icon-button
            color="primary"
            (click)="edit.emit(row)">

            <mat-icon>edit</mat-icon>

          </button>

        }

        @if(showDelete){

          <button
            mat-icon-button
            color="warn"
            (click)="delete.emit(row)">

            <mat-icon>delete</mat-icon>

          </button>

        }

        @if(showSubmit){

          <button
            mat-icon-button
            color="accent"
            (click)="submit.emit(row)">

            <mat-icon>send</mat-icon>

          </button>

        }

        @if(showValidate){

          <button
            mat-icon-button
            color="primary"
            (click)="validate.emit(row)">

            <mat-icon>check_circle</mat-icon>

          </button>

        }

        @if(showReject){

          <button
            mat-icon-button
            color="warn"
            (click)="reject.emit(row)">

            <mat-icon>cancel</mat-icon>

          </button>

        }

      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">

    </tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns">

    </tr>

  </table>

  <mat-paginator
    [length]="total"
    [pageIndex]="page - 1"
    [pageSize]="limit"
    [pageSizeOptions]="[5,10,20,50,100]"
    showFirstLastButtons
    (page)="pageChange.emit($event)">

  </mat-paginator>

</div>
