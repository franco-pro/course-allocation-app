<aside class="sidebar">

    <div class="logo">

        <img src="assets/images/logo.png">

        <div>

            <h2>IUG</h2>

            <small>Course Allocation</small>

        </div>

    </div>

    <nav>

        @for(item of visibleMenu; track item.route){

        <a

            [routerLink]="item.route"

            routerLinkActive="active">

            <img
                [src]="item.icon"
                alt="">

            <span>

                {{item.label}}

            </span>

        </a>

        }

    </nav>

    <div class="bottom">

        <button type="button" class="btn-logout-principal" (click)="openLogoutModal()">

            <img src="assets/images/log-out.svg" alt="">

            <span>Déconnexion</span>

        </button>

        @if(showLogoutModal){
            <div class="modal-overlay" (click)="closeLogoutModal()">
                <div class="logout-modal" (click)="$event.stopPropagation()">
                    <div class="modal-icon">
                        <img src="assets/images/log-out.png" alt="">
                    </div>
                    <h3>Confirmation de déconnexion</h3>
                    <p>Êtes-vous sûr de vouloir vous déconnecter? votre session sera fermée, et vous perdrez tous les changements non enregistrés.</p>
                    <div class="modal-actions">
                        <button class="btn-cancel" type="button" (click)="closeLogoutModal()">Annuler</button>
                        <button class="btn-confirm" type="button" (click)="logout()">Se déconnecter</button>
                    </div>

                </div>
            </div>
        }

    </div>

</aside>
